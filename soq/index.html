<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Soq</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="quiz-container">
    <h1>Soq Test</h1>
    <form action="submit.html" method="GET">
      <div class="quiz-question">
        <h3>1. What is the capital of France?</h3>
        <label>
          <input type="radio" name="question1" value="A"> A) Berlin
        </label>
        <label>
          <input type="radio" name="question1" value="B"> B) Madrid
        </label>
        <label>
          <input type="radio" name="question1" value="C"> C) Paris
        </label>
        <label>
          <input type="radio" name="question1" value="D"> D) Rome
        </label>
      </div>
      <div class="quiz-question">
        <h3>2. What is 2 + 2?</h3>
        <label>
          <input type="radio" name="question2" value="A"> A) 3
        </label>
        <label>
          <input type="radio" name="question2" value="B"> B) 4
        </label>
        <label>
          <input type="radio" name="question2" value="C"> C) 5
        </label>
        <label>
          <input type="radio" name="question2" value="D"> D) 6
        </label>
      </div>
      <button type="submit">Submit Quiz</button>
    </form>
  </div>
</body>
</html>
